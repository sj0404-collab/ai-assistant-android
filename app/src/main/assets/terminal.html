<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
        }
        #terminal {
            height: 100vh;
            width: 100%;
        }
        #input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #2d2d2d;
            padding: 10px;
            display: flex;
            gap: 10px;
        }
        #command-input {
            flex: 1;
            background: #3c3c3c;
            border: 1px solid #555;
            color: #d4d4d4;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 4px;
        }
        #send-btn {
            background: #1976D2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        #send-btn:hover {
            background: #1565C0;
        }
        .output {
            margin: 5px 10px;
            padding: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .command {
            color: #4EC9B0;
        }
        .error {
            color: #F44747;
        }
        .info {
            color: #569CD6;
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <div id="input-area">
        <input type="text" id="command-input" placeholder="Enter command..." autofocus>
        <button id="send-btn">Run</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script>
        const terminal = document.getElementById('terminal');
        const commandInput = document.getElementById('command-input');
        const sendBtn = document.getElementById('send-btn');
        const outputDiv = document.createElement('div');
        terminal.appendChild(outputDiv);

        // Initialize xterm
        const term = new window.Terminal({
            theme: {
                background: '#1e1e1e',
                foreground: '#d4d4d4',
                cursor: '#d4d4d4',
                selectionBackground: '#264f78'
            },
            fontFamily: "'Courier New', monospace",
            fontSize: 14
        });

        term.open(terminal);

        // Command history
        let commandHistory = [];
        let historyIndex = -1;

        // Available commands
        const commands = {
            'help': () => {
                return `Available commands:
  help     - Show this help
  clear    - Clear terminal
  echo     - Echo text
  date     - Show current date/time
  whoami   - Show current user
  ls       - List files
  cat      - Show file contents
  pwd      - Print working directory
  opencode - Run OpenCode AI
  exit     - Close terminal`;
            },
            'clear': () => {
                outputDiv.innerHTML = '';
                return '';
            },
            'echo': (args) => args.join(' '),
            'date': () => new Date().toLocaleString(),
            'whoami': () => 'android_user',
            'ls': () => 'Documents/  Downloads/  Pictures/  ai_assistant/',
            'cat': (args) => {
                if (args.length === 0) return 'Usage: cat <filename>';
                return `Contents of ${args[0]}:
This is a sample file content.
AI Assistant can process files and send them to AI providers.`;
            },
            'pwd': () => '/storage/emulated/0',
            'opencode': (args) => {
                return `OpenCode AI Assistant
Running in local mode.
Use the main app to:
1. Select a file
2. Choose an AI provider
3. Enter your prompt
4. Get AI-powered response`;
            },
            'exit': () => {
                window.Android?.finish();
                return 'Closing terminal...';
            }
        };

        // Execute command
        function executeCommand(cmd) {
            const trimmed = cmd.trim();
            if (!trimmed) return;

            // Add to history
            commandHistory.push(trimmed);
            historyIndex = commandHistory.length;

            // Display command
            term.writeln('\r\n\x1b[32m$\x1b[0m ' + trimmed);

            // Parse command
            const parts = trimmed.split(' ');
            const command = parts[0];
            const args = parts.slice(1);

            // Execute
            if (commands[command]) {
                const result = commands[command](args);
                if (result) {
                    term.writeln(result);
                }
            } else {
                term.writeln(`\x1b[31mCommand not found: ${command}\x1b[0m`);
                term.writeln('Type "help" for available commands');
            }
        }

        // Event listeners
        commandInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                executeCommand(commandInput.value);
                commandInput.value = '';
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    commandInput.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    commandInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    commandInput.value = '';
                }
            }
        });

        sendBtn.addEventListener('click', () => {
            executeCommand(commandInput.value);
            commandInput.value = '';
        });

        // Initial message
        term.writeln('\x1b[1;36m╔══════════════════════════════════════╗');
        term.writeln('\x1b[1;36m║     AI Assistant Terminal            ║');
        term.writeln('\x1b[1;36m║     Type "help" for commands         ║');
        term.writeln('\x1b[1;36m╚══════════════════════════════════════╝');
        term.writeln('');
        term.write('\x1b[32m$\x1b[0m ');

        // Focus input
        commandInput.focus();
    </script>
</body>
</html>
